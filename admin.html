<!DOCTYPE html>
<!--
  =============================================================================
  AURA FÉMININE — Administration (admin.html)
  -----------------------------------------------------------------------------
  Interface d'administration statique. La sécurité NE repose PAS sur ce fichier :
  chaque lecture/écriture est contrôlée par Supabase Auth + Row Level Security
  (rôle "admin" dans public.profiles). Seule la clé publique "anon" est utilisée.

  Organisation du JavaScript :
    1. Configuration        8. Catégories           15. Pages (destination, légales)
    2. Utilitaires / UI      9. Produits             16. Contact
    3. Auth                 10. Commandes           17. SEO
    4. Mise en page/routeur 11. Clients             18. Paramètres
    5. Tableau de bord      12. Paniers abandonnés  19. Sécurité / compte
    6. Paramètres boutique  13. Livraison           20. Démarrage
    7. Constructeur page    14. Réseaux sociaux
  =============================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Aura Féminine</title>
<meta name="theme-color" content="#1d1718">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="icons/admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aura Admin">
<link rel="icon" href="icons/admin-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --brand:#1d1718; --brand-2:#b28a58; --ink:#1f1a1d; --ink-2:#4b4247; --muted:#867b81; --line:#ece6e2; --line-2:#e1d8d2;
  --bg:#f6f3f0; --panel:#ffffff; --soft:#faf7f5; --ok:#2f7d55; --ok-bg:#e8f4ed; --warn:#a86a12; --warn-bg:#fbf1e1; --bad:#b0303f; --bad-bg:#fbe9eb;
  --info:#2f5f9e; --info-bg:#e9f0fa; --radius:12px; --shadow:0 1px 2px rgba(31,26,29,.05),0 6px 24px -12px rgba(31,26,29,.18);
  --sidebar:#171213; --sidebar-ink:#e9dfe3; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.muted{color:var(--muted)}
.serif{font-family:var(--serif)}

/* ---------- Connexion ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:radial-gradient(circle at 70% 30%,#3a2f2b 0,#1f1819 45%,#0f0b0c 100%);color:#f3e6dc;display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:520px;height:520px;border:1px solid rgba(232,207,169,.25);border-radius:50% 50% 0 0}
.login-art h1{font-family:var(--serif);font-size:3rem;font-weight:500;line-height:1.05;max-width:460px}
.login-art .logo-row{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase}
.login-art .logo-row img{height:120px;width:auto}
.login-form{display:grid;place-items:center;padding:32px}
.login-card{width:min(400px,100%)}
.login-card h2{font-size:1.6rem;margin-bottom:6px}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{min-height:200px;padding:28px}.login-art h1{font-size:2rem}}

/* ---------- Mise en page ---------- */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:var(--sidebar-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:50}
.sb-brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;font-family:var(--serif);font-size:1.25rem;letter-spacing:.12em;text-transform:uppercase}
.sb-brand img{height:52px;width:auto;max-width:150px;object-fit:contain}
.sb-brand small{display:block;font-family:var(--font);letter-spacing:.1em;font-size:.62rem;opacity:.55}
.sb-nav{flex:1;overflow-y:auto;padding:6px 12px 20px}
.sb-nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;text-decoration:none;opacity:.78;font-weight:500;font-size:.88rem;transition:background .15s,opacity .15s}
.sb-nav a:hover{background:rgba(255,255,255,.06);opacity:1}
.sb-nav a[aria-current="page"]{background:rgba(232,207,169,.14);opacity:1;color:#fff}
.sb-nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.sb-nav .sb-sep{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;opacity:.4;padding:16px 12px 6px}
.sb-nav .count{margin-left:auto;background:var(--brand-2);color:#1d1718;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 7px}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:.8rem;display:flex;align-items:center;gap:10px}
.sb-foot .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.75}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(246,243,240,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none}
.content{padding:26px 28px 60px;max-width:1400px;width:100%}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .burger{display:inline-grid}
  .topbar{padding:12px 16px}
  .content{padding:18px 16px 80px}
}
.scrim{position:fixed;inset:0;background:rgba(20,12,16,.45);z-index:45;display:none}
.scrim.show{display:block}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:500;font-size:.86rem;white-space:nowrap;transition:filter .15s,background .15s,opacity .15s;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn-ghost{background:var(--panel);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--soft);filter:none}
.btn-danger{background:var(--bad);border-color:var(--bad)}
.btn-soft-danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn-sm{height:32px;padding:0 11px;font-size:.8rem;border-radius:8px}
.btn-xs{height:28px;padding:0 9px;font-size:.76rem;border-radius:7px}
.btn-block{width:100%}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.05)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h2{font-size:1rem}
.card + .card{margin-top:18px}
.grid > .card + .card{margin-top:0}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g-2,.g-3{grid-template-columns:1fr}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.brand{background:#f3ebe0;color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:38px;height:38px;margin:0 auto 10px;opacity:.5}
.loading{display:grid;place-items:center;padding:60px;color:var(--muted)}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--info-bg);color:var(--info);font-size:.86rem;margin-bottom:14px}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice.bad{background:var(--bad-bg);color:var(--bad)}.notice.ok{background:var(--ok-bg);color:var(--ok)}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:5px}

/* ---------- Tableaux (cartes sur mobile) ---------- */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.clickable{cursor:pointer}
.t tbody tr.clickable:hover{background:var(--soft)}
.t .thumb{width:42px;height:50px;border-radius:7px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.t td.actions{text-align:right;width:1%}
.t div.actions{display:flex;gap:2px;justify-content:flex-end;white-space:nowrap}
.t .strong{font-weight:600}
.t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .t thead{display:none}
  .t,.t tbody,.t tr,.t td{display:block;width:100%}
  .t tr{border-bottom:1px solid var(--line);padding:10px 4px}
  .t td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:right}
  .t td::before{content:attr(data-label);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left}
  .t td.num{text-align:right}
  .t div.actions{justify-content:flex-end}
  .t td.actions{width:100%}
  .t td.actions::before,.t td[data-label=""]::before{content:none}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);flex-wrap:wrap}

/* ---------- Formulaires ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:700px){.form-grid{grid-template-columns:1fr}}
.f{display:grid;gap:5px;align-content:start}
.f > label,.f > .lbl{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.f .hint{font-size:.75rem;color:var(--muted)}
.f .err{font-size:.76rem;color:var(--bad)}
.in,select.in,textarea.in{width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:#fff;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;min-height:90px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(178,138,88,.22)}
.in[aria-invalid="true"]{border-color:var(--bad)}
.f-section{grid-column:1/-1;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:38px}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#d9d0cb;position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(16px)}
.switch span{font-size:.86rem}
.color-in{display:flex;gap:8px;align-items:center}
.color-in input[type=color]{width:42px;height:38px;border:1px solid var(--line-2);border-radius:9px;padding:3px;background:#fff;flex:none}
.img-field{display:flex;gap:12px;align-items:center}
.img-field .preview{width:84px;height:84px;border-radius:10px;border:1px dashed var(--line-2);background:var(--soft) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.img-field .preview img{width:100%;height:100%;object-fit:cover}
.img-field .preview svg{width:24px;height:24px;opacity:.5}
.img-field .col{flex:1;display:grid;gap:6px;min-width:0}
.img-field .row{display:flex;gap:6px;flex-wrap:wrap}
.list-editor{display:grid;gap:10px}
.list-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);position:relative}
.list-item .li-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.78rem;font-weight:600;color:var(--muted)}
.list-item .li-actions{display:flex;gap:2px}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px}

/* ---------- Modale ---------- */
dialog.modal{border:0;padding:0;border-radius:16px;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
dialog.modal:not([open]){display:none}
dialog.modal.lg{width:min(1040px,calc(100vw - 24px))}
dialog.modal.sm{width:min(460px,calc(100vw - 24px))}
dialog.modal::backdrop{background:rgba(20,12,16,.5);backdrop-filter:blur(2px)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:1.05rem}
.m-body{padding:20px;overflow-y:auto;flex:1}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.m-foot .left{margin-right:auto;display:flex;gap:8px}
@media (max-width:600px){dialog.modal,dialog.modal.lg{width:100vw;max-width:100vw;height:100%;max-height:100%;border-radius:0}}

/* ---------- Toasts ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:8px;width:min(380px,calc(100vw - 40px))}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:.86rem;animation:tin .25s ease}
.toast.error{background:var(--bad)}
.toast svg{width:17px;height:17px;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Tableau de bord ---------- */
.kpi{padding:16px 18px;display:grid;gap:4px}
.kpi .k-label{font-size:.76rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .k-label svg{width:15px;height:15px}
.kpi .k-val{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:.76rem;color:var(--muted)}
.kpi.accent{background:linear-gradient(135deg,#2e2426,#120e0f);color:#fff;border:0}
.kpi.accent .k-label,.kpi.accent .k-sub{color:rgba(255,255,255,.7)}
.chart{width:100%;height:240px;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.bar-list{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.84rem}
.bar-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar-row .bar span{display:block;height:100%;background:var(--brand-2);border-radius:3px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:.8rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* ---------- Constructeur de page ---------- */
.builder{display:grid;gap:10px}
.sec-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .2s,opacity .2s}
.sec-row.hidden-sec{opacity:.55}
.sec-row .handle{cursor:grab;color:var(--muted);display:grid;place-items:center;width:28px;height:34px;border-radius:6px;touch-action:none}
.sec-row .handle:hover{background:var(--soft)}
.sec-row .handle svg{width:18px;height:18px}
.sec-row .s-ico{width:38px;height:38px;border-radius:10px;background:#f3ebe0;color:var(--brand);display:grid;place-items:center;flex:none}
.sec-row .s-ico svg{width:18px;height:18px}
.sec-row .s-body{flex:1;min-width:0}
.sec-row .s-body strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-row .s-body small{color:var(--muted)}
.sec-row .s-actions{display:flex;gap:2px;align-items:center}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 12px 30px -10px rgba(0,0,0,.3)}
@media (max-width:700px){.sec-row{flex-wrap:wrap}.sec-row .s-actions{width:100%;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px}}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.type-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.type-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.type-card .s-ico{width:36px;height:36px;border-radius:9px;background:#f3ebe0;color:var(--brand);display:grid;place-items:center;flex:none}
.type-card .s-ico svg{width:18px;height:18px}
.type-card strong{display:block;font-size:.88rem}
.type-card small{color:var(--muted);font-size:.76rem;line-height:1.35;display:block;margin-top:2px}

/* ---------- Produits : images ---------- */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.img-tile{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);aspect-ratio:4/5}
.img-tile img{width:100%;height:100%;object-fit:cover}
.img-tile .tile-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.img-tile .tile-bar button{background:rgba(255,255,255,.92);border:0;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink)}
.img-tile .tile-bar button svg{width:15px;height:15px}
.img-tile .primary-tag{position:absolute;top:6px;left:6px}
.img-tile.drag{cursor:grab}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s;cursor:pointer}
.drop.over{border-color:var(--brand);background:#f8f0f3}
.drop svg{width:26px;height:26px;margin:0 auto 6px;opacity:.6}
.var-table .in{height:34px;padding:0 8px;font-size:.84rem}
.var-table td{padding:6px 6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.preset{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;display:grid;gap:6px;text-align:left;min-width:120px}
.preset .sw{display:flex;height:22px;border-radius:6px;overflow:hidden}
.preset .sw i{flex:1}
.preset small{font-size:.74rem;font-weight:600}
.serp{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;font-family:arial,sans-serif}
.serp .u{color:#202124;font-size:.8rem}.serp .t{color:#1a0dab;font-size:1.15rem;margin:4px 0}.serp .d{color:#4d5156;font-size:.86rem}
.timeline{display:grid;gap:10px}
.timeline .ev{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:.84rem}
.timeline .ev i{width:10px;height:10px;border-radius:50%;background:var(--brand-2);margin-top:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.order-lines .ol{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.order-lines img{width:48px;height:58px;object-fit:cover;border-radius:7px;background:var(--soft)}
.rich-preview{border:1px solid var(--line);border-radius:10px;padding:14px 18px;background:#fff;max-height:340px;overflow:auto;line-height:1.65}
.rich-preview h2{font-size:1.2rem;margin:.8em 0 .4em}.rich-preview h3{font-size:1.05rem}
.setup{max-width:640px;margin:60px auto;padding:28px}
.print-area{display:none}
@media print{body>*:not(.print-area){display:none!important}.print-area{display:block;color:#000;font:13px/1.5 Arial,sans-serif;padding:10mm}dialog{display:none!important}}
</style>

  if (bmp && (bmp.width < 50 || bmp.height < 50)) throw new Error('AF:Image trop petite (50 px minimum).');

/* Graphique SVG léger (barres = commandes, courbe = chiffre d'affaires) */
function chart(series) {
  const W = 760, H = 240, P = { l: 52, r: 14, t: 14, b: 26 };
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');

  const iw = W - P.l - P.r, ih = H - P.t - P.b, step = iw / series.length;
  for (let i = 0; i <= 4; i++) {
    const y = P.t + ih - (ih * i / 4);

    const t = el('text', { x: P.l - 8, y: y + 3, 'text-anchor': 'end' }); t.textContent = nf.format(Math.round(maxR * i / 4 / 100) * 100); svg.appendChild(t);
  }
  series.forEach((s, i) => {
    const bh = ih * Number(s.orders) / maxO, x = P.l + i * step + step * 0.2;
    const r = el('rect', { x, y: P.t + ih - bh, width: Math.max(2, step * 0.6), height: bh, rx: 3, fill: '#e9dccf' });
    const tt = el('title', {}); tt.textContent = `${fmtDate(s.day, false)} : ${s.orders} commande(s), ${money(s.revenue)}`; r.appendChild(tt); svg.appendChild(r);
  });

function sectionSummary(s) {

  const src = { featured: 'vedettes', new: 'nouveautés', sale: 'promotions', category: 'catégorie', manual: 'sélection manuelle', latest: 'derniers ajouts' };
  return [c.title, s.type === 'products' ? 'Source : ' + (src[st.source] || st.source) + ' · ' + (st.limit || 8) + ' produits' : null].filter(Boolean).join(' — ') || (SECTION_TYPES[s.type] || {}).d || '';
}
async function builderContext() {
  const [categories, products] = await Promise.all([
    q(sb.from('categories').select('id,name').order('sort_order')), q(sb.from('products').select('id,name').order('name').limit(500))]);
  return { categories, products };
}
async function sectionBuilder(container, landingId) {
  const list = h('div', { class: 'builder' });
  const addBtn = h('button', { class: 'btn' }, icon('plus'), 'Ajouter une section');
  mount(container, h('div', { class: 'toolbar' }, h('div', { class: 'grow muted', text: 'Glissez-déposez pour réordonner. Les changements sont enregistrés immédiatement.' }), addBtn), list);
  let rows = [], ctx = null;
  const base = () => { let qb = sb.from('homepage_sections').select('*').order('sort_order'); return landingId ? qb.eq('landing_page_id', landingId) : qb.is('landing_page_id', null); };
  async function load() { rows = await q(base()); draw(); }
  async function persistOrder() { await rpc('admin_reorder', { p_table: 'homepage_sections', p_ids: rows.map(r => r.id) }); rows.forEach((r, i) => r.sort_order = (i + 1) * 10); }
  function draw() {
    if (!rows.length) { mount(list, h('div', { class: 'card empty' }, icon('layout'), h('div', { text: 'Aucune section. Ajoutez votre première section.' }))); return; }
    mount(list, rows.map((s, i) => {
      const t = SECTION_TYPES[s.type] || { l: s.type, i: 'layout' };
      const move = async d => { const j = i + d; if (j < 0 || j >= rows.length) return; [rows[i], rows[j]] = [rows[j], rows[i]]; draw(); await act(null, persistOrder); };
      return h('div', { class: 'sec-row' + (s.is_active ? '' : ' hidden-sec'), dataset: { id: s.id } },
        h('span', { class: 'handle', title: 'Glisser pour déplacer', 'aria-hidden': 'true' }, icon('grip')),
        h('span', { class: 's-ico' }, icon(t.i)),
        h('div', { class: 's-body' }, h('strong', { text: (s.title || t.l) }), h('small', { text: t.l + ' · ' + sectionSummary(s) })),
        h('div', { class: 's-actions' },
          s.is_active ? null : h('span', { class: 'pill', text: 'Masquée' }),
          h('button', { class: 'icon-btn', title: 'Monter', 'aria-label': 'Monter', disabled: i === 0, onclick: () => move(-1) }, icon('up')),
          h('button', { class: 'icon-btn', title: 'Descendre', 'aria-label': 'Descendre', disabled: i === rows.length - 1, onclick: () => move(1) }, icon('down')),
          h('button', { class: 'icon-btn', title: s.is_active ? 'Masquer' : 'Afficher', 'aria-label': s.is_active ? 'Masquer' : 'Afficher', onclick: async e => {
            const r = await act(e.currentTarget, () => q(sb.from('homepage_sections').update({ is_active: !s.is_active }).eq('id', s.id)), s.is_active ? 'Section masquée.' : 'Section affichée.');
            if (r !== undefined) { s.is_active = !s.is_active; draw(); }
          } }, icon(s.is_active ? 'eye' : 'eyeoff')),
          h('button', { class: 'icon-btn', title: 'Dupliquer', 'aria-label': 'Dupliquer', onclick: async e => { if (await act(e.currentTarget, () => rpc('admin_duplicate_section', { p_id: s.id }), 'Section dupliquée.')) load(); } }, icon('copy')),
          h('button', { class: 'icon-btn', title: 'Modifier', 'aria-label': 'Modifier', onclick: () => edit(s) }, icon('edit')),
          h('button', { class: 'icon-btn danger', title: 'Supprimer', 'aria-label': 'Supprimer', onclick: async e => {
            if (!await confirmDialog(`Supprimer la section « ${s.title || t.l} » ? Cette action est définitive.`, { ok: 'Supprimer' })) return;
            if (await act(e.currentTarget, () => q(sb.from('homepage_sections').delete().eq('id', s.id)), 'Section supprimée.') !== undefined) { rows = rows.filter(r => r.id !== s.id); draw(); }
          } }, icon('trash'))));
    }));
    if (window.Sortable) Sortable.create(list, { handle: '.handle', animation: 160, onEnd: async () => {
      const ids = $$('.sec-row', list).map(n => n.dataset.id); rows = ids.map(id => rows.find(r => r.id === id)); draw();
      await act(null, persistOrder, 'Ordre enregistré.');
    } });
  }
  async function edit(s) {
    ctx = ctx || await builderContext();
    const t = SECTION_TYPES[s.type];
    if (!t) { toast('Type de section inconnu.', 'error'); return; }
    const form = buildForm([{ k: 'title', l: 'Nom interne de la section', max: 200, hint: 'Visible uniquement dans l’admin.' }, { k: 'is_active', l: 'Section visible', t: 'switch' }, { t: 'section', l: 'Contenu' }, ...t.fields(ctx)], s);
    const save = h('button', { class: 'btn' }, icon('check'), 'Enregistrer');
    const m = openModal({ title: 'Modifier : ' + t.l, size: 'lg', body: form.el, actions: [h('button', { class: 'btn btn-ghost', onclick: () => m.close() }, 'Annuler'), save] });
    save.addEventListener('click', async () => {
      if (!form.validate()) return;
      const v = form.get({ content: s.content || {}, settings: s.settings || {} });
      ['columns_desktop', 'columns_mobile', 'columns'].forEach(k => { if (v.settings[k] != null && v.settings[k] !== '') v.settings[k] = Number(v.settings[k]); });
      if (v.settings.category_id === '') v.settings.category_id = null;
      const r = await act(save, () => q(sb.from('homepage_sections').update({ title: v.title || null, is_active: v.is_active, content: v.content, settings: v.settings }).eq('id', s.id).select().single()), 'Section enregistrée.');
      if (r) { Object.assign(s, r); m.clean(); m.close(); draw(); }
    });
  }
  addBtn.addEventListener('click', () => {
    const m = openModal({ title: 'Ajouter une section', size: 'lg', body: h('div', { class: 'type-grid' }, Object.entries(SECTION_TYPES).map(([k, t]) => h('button', { class: 'type-card', type: 'button', onclick: async () => {
      m.close();
      const r = await act(null, () => q(sb.from('homepage_sections').insert({ type: k, title: t.l, content: clone(t.content), settings: clone(t.settings), landing_page_id: landingId || null,
        sort_order: (rows.length ? Math.max(...rows.map(x => x.sort_order)) : 0) + 10, is_active: true }).select().single()), 'Section ajoutée.');
      if (r) { rows.push(r); draw(); edit(r); }
    } }, h('span', { class: 's-ico' }, icon(t.i)), h('div', {}, h('strong', { text: t.l }), h('small', { text: t.d }))))) });
  });
  await load();
}

/* CRUD générique (tables simples) */
async function crudPage(c, cfg) {
  const body = h('div', {});
  const addBtn = cfg.noAdd ? null : h('button', { class: 'btn', onclick: () => edit(null) }, icon('plus'), cfg.addLabel || 'Ajouter');
  mount(c, cardWith(cfg.title, [cfg.extraActions || null, addBtn], body));
  let rows = [];
  async function load() {
    mount(body, h('div', { class: 'loading' }, h('span', { class: 'spinner' })));
    try {
      let qb = sb.from(cfg.table).select(cfg.select || '*');
      if (cfg.filter) qb = cfg.filter(qb);
      rows = await q(qb.order(cfg.order || 'created_at', { ascending: !!cfg.order && cfg.order !== 'created_at' }));
      if (cfg.onLoad) cfg.onLoad(rows);
      draw();
    } catch (e) { mount(body, h('div', { class: 'card-pad' }, h('div', { class: 'notice bad' }, icon('alert'), h('span', { text: errMsg(e) })))); }
  }
  function draw() {
    const cols = [...(cfg.reorder ? [{ l: '', r: () => h('span', { class: 'handle', style: { cursor: 'grab', color: 'var(--muted)' }, title: 'Glisser pour réordonner' }, icon('grip')) }] : []), ...cfg.columns,
      { l: '', cls: 'actions', r: r => h('div', { class: 'actions' }, (cfg.rowActions ? cfg.rowActions(r, load) : []),
        h('button', { class: 'icon-btn', 'aria-label': 'Modifier', title: 'Modifier', onclick: () => edit(r) }, icon('edit')),
        cfg.noDelete ? null : h('button', { class: 'icon-btn danger', 'aria-label': 'Supprimer', title: 'Supprimer', onclick: async e => {
          if (!await confirmDialog(cfg.deleteMsg ? cfg.deleteMsg(r) : 'Supprimer cet élément ? Cette action est définitive.', { ok: 'Supprimer' })) return;
          if (await act(e.currentTarget, async () => { await q(sb.from(cfg.table).delete().eq('id', r.id)); if (cfg.afterDelete) await cfg.afterDelete(r); }, 'Élément supprimé.') !== undefined) load();
        } }, icon('trash'))) }];
    mount(body, table(cols, rows, { empty: cfg.empty || 'Aucun élément pour le moment.', onRow: r => edit(r) }));
    const tb = $('tbody', body);
    if (cfg.reorder && tb && window.Sortable) {
      $$('tr', tb).forEach((tr, i) => tr.dataset.id = rows[i].id);
      Sortable.create(tb, { handle: '.handle', animation: 150, onEnd: () => act(null, () => rpc('admin_reorder', { p_table: cfg.table, p_ids: $$('tr', tb).map(t => t.dataset.id) }), 'Ordre enregistré.') });
    }
  }
  function edit(row) {
    const isNew = !row;
    const values = row ? clone(row) : clone(cfg.defaults || {});
    const form = buildForm(typeof cfg.fields === 'function' ? cfg.fields(row) : cfg.fields, values);
    const save = h('button', { class: 'btn' }, icon('check'), 'Enregistrer');
    const m = openModal({ title: (isNew ? 'Ajouter' : 'Modifier') + ' — ' + cfg.title, size: cfg.size || '', body: h('div', {}, cfg.formNote ? h('div', { class: 'notice' }, icon('info'), h('span', { text: cfg.formNote })) : null, form.el),
      actions: [h('button', { class: 'btn btn-ghost', onclick: () => m.close() }, 'Annuler'), save] });
    save.addEventListener('click', async () => {
      if (!form.validate()) return;
      let v = form.get({});
      if (cfg.transform) v = cfg.transform(v, row);
      if (cfg.validate) { const e = cfg.validate(v); if (e) { toast(e, 'error'); return; } }
      if (isNew && cfg.reorder) v.sort_order = (rows.length ? Math.max(...rows.map(r => r.sort_order || 0)) : 0) + 10;
      const r = await act(save, () => isNew ? q(sb.from(cfg.table).insert(v).select().single()) : q(sb.from(cfg.table).update(v).eq('id', row.id).select().single()), 'Enregistré.');
      if (r) { m.clean(); m.close(); if (cfg.afterSave) await cfg.afterSave(r); load(); }
    });
  }
  await load();
  return { reload: load };
}

async function drawMfa(box) {
  const { data, error } = await sb.auth.mfa.listFactors();
  if (error) throw error;
  const verified = (data.totp || []).filter(f => f.status === 'verified');
  if (verified.length) {
    mount(box, h('div', { class: 'notice ok', style: { 'margin-bottom': '12px' } }, icon('shield'), h('span', { text: 'Activée : un code de votre application d’authentification est demandé à chaque connexion. Le serveur refuse les actions admin sans ce second facteur.' })),
      h('button', { class: 'btn btn-ghost btn-sm', style: { color: 'var(--bad)' }, onclick: async e => {
        if (!await confirmDialog('Désactiver la double authentification ? Votre compte ne sera plus protégé que par le mot de passe.', { ok: 'Désactiver' })) return;
        if (await act(e.currentTarget, async () => { for (const f of verified) { const r = await sb.auth.mfa.unenroll({ factorId: f.id }); if (r.error) throw r.error; } await sb.auth.refreshSession(); }, 'Double authentification désactivée.') !== undefined) drawMfa(box);
      } }, 'Désactiver'));
    return;
  }
  const start_ = h('button', { class: 'btn btn-sm' }, icon('shield'), 'Activer');
  mount(box, h('p', { class: 'muted', style: { 'margin-top': 0 }, text: 'Fortement recommandé : même si votre mot de passe fuite, personne ne pourra administrer la boutique sans le code à 6 chiffres de votre téléphone (Google Authenticator, Microsoft Authenticator, 2FAS…).' }), start_);
  start_.addEventListener('click', () => act(start_, async () => {
    // nettoie un éventuel facteur non vérifié laissé par une tentative précédente
    for (const f of (data.all || []).filter(f => f.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: f.id });
    const { data: en, error: e1 } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Admin ' + new Date().toISOString().slice(0, 10) });
    if (e1) throw e1;
    const code = h('input', { class: 'in', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '123456', style: { 'max-width': '160px', 'letter-spacing': '.3em', 'font-size': '1.1rem' } });
    const verify = h('button', { class: 'btn btn-sm' }, 'Vérifier et activer');
    const qr = /^data:image\/svg\+xml/.test(en.totp.qr_code || '') ? en.totp.qr_code : null;
    mount(box, h('ol', { style: { 'padding-left': '18px', margin: '0 0 12px', 'line-height': 1.7 } }, h('li', { text: 'Scannez ce QR code avec votre application d’authentification.' }), h('li', { text: 'Saisissez le code à 6 chiffres affiché.' })),
      qr ? h('img', { src: qr, alt: 'QR code de configuration', style: { width: '180px', height: '180px', background: '#fff', padding: '8px', 'border-radius': '10px', border: '1px solid var(--line)' } }) : null,
      h('p', { class: 'muted', style: { 'font-size': '.8rem' } }, 'Clé manuelle : ', h('span', { class: 'kbd', text: en.totp.secret })),
      h('div', { style: { display: 'flex', gap: '8px', 'align-items': 'center' } }, code, verify));
    code.focus();
    verify.addEventListener('click', async () => {
      if (!/^\d{6}$/.test(code.value.trim())) { toast('Code à 6 chiffres attendu.', 'error'); return; }
      if (await act(verify, async () => { const r = await sb.auth.mfa.challengeAndVerify({ factorId: en.id, code: code.value.trim() }); if (r.error) throw new Error('AF:Code incorrect ou expiré.'); }, 'Double authentification activée.') !== undefined) drawMfa(box);
    });
  }));
}

/* =============================================================================
   20. DÉMARRAGE
   ============================================================================= */
async function refreshCounts() {
  try {
    const [o, cts] = await Promise.all([
      sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'new'),
      sb.from('abandoned_carts').select('id', { count: 'exact', head: true }).eq('status', 'open').not('customer_phone', 'is', null)]);
    const next = { orders: o.count || 0, carts: cts.count || 0 };
    const grew = A.counts.orders != null && next.orders > A.counts.orders;
    A.counts = next;
    [['orders', next.orders], ['carts', next.carts]].forEach(([k, n]) => {
      const a = $(`.sb-nav a[data-page="${k}"]`); if (!a) return;
      let b = $('.count', a); if (!n) { b && b.remove(); return; }
      if (!b) { b = h('span', { class: 'count' }); a.appendChild(b); } b.textContent = String(n);
    });
    document.title = (next.orders ? `(${next.orders}) ` : '') + document.title.replace(/^\(\d+\)\s*/, '');
    if (grew) toast('Nouvelle commande reçue !');
  } catch { /* compteurs non bloquants */ }
}
/* Second facteur requis par le compte ? (niveau aal2) */
function mfaScreen(factor) {
  const code = h('input', { class: 'in', id: 'mfa-code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '123456', style: { 'letter-spacing': '.3em', 'font-size': '1.2rem', 'text-align': 'center' } });
  const msg = h('div', { role: 'alert' });
  const btn = h('button', { class: 'btn btn-block', type: 'submit', style: { height: '44px' }, text: 'Valider' });
  mount($('#root'), h('div', { class: 'login' }, h('div', { class: 'login-art' }, h('h1', { text: 'Vérification en deux étapes' }), h('p', { style: { opacity: .7, margin: 0 }, text: 'Protection renforcée du compte administrateur.' })),
    h('div', { class: 'login-form' }, h('form', { class: 'login-card', onsubmit: async e => {
      e.preventDefault(); clear(msg);
      if (!/^\d{6}$/.test(code.value.trim())) { mount(msg, h('div', { class: 'notice bad' }, icon('alert'), h('span', { text: 'Code à 6 chiffres attendu.' }))); return; }
      btn.disabled = true;
      const r = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code: code.value.trim() });
      btn.disabled = false;
      if (r.error) { code.value = ''; mount(msg, h('div', { class: 'notice bad' }, icon('alert'), h('span', { text: 'Code incorrect ou expiré.' }))); return; }
      start();
    } }, h('h2', { class: 'serif', text: 'Code de sécurité' }), h('p', { class: 'muted', style: { margin: '0 0 18px' }, text: 'Saisissez le code à 6 chiffres de votre application d’authentification.' }),
      h('div', { class: 'f', style: { 'margin-bottom': '14px' } }, h('label', { for: 'mfa-code', text: 'Code' }), code), msg, btn,
      h('button', { type: 'button', class: 'btn btn-ghost btn-block', style: { 'margin-top': '10px' }, onclick: logout }, 'Annuler')))));
  setTimeout(() => code.focus(), 50);
}
let countTimer = null;
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { await loadSettings(); loginScreen(); return; }
  const { data: { user }, error } = await sb.auth.getUser();
  if (error || !user) { await sb.auth.signOut().catch(() => {}); loginScreen('Session expirée. Reconnectez-vous.'); return; }
  try {
    const aal = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal.data && aal.data.nextLevel === 'aal2' && aal.data.currentLevel !== 'aal2') {
      const f = await sb.auth.mfa.listFactors();
      const factor = ((f.data && f.data.totp) || []).find(x => x.status === 'verified');
      if (factor) { mfaScreen(factor); return; }
    }
  } catch { /* MFA indisponible : le serveur refusera de toute façon si aal2 requis */ }
  let admin = false;
  try { admin = await rpc('is_admin'); } catch { admin = false; }
  if (!admin) { await sb.auth.signOut().catch(() => {}); A.user = null; loginScreen('Ce compte n’a pas accès à l’administration.'); return; }
  A.user = user;
  await loadSettings();
  layout();
  await refreshCounts();
  clearInterval(countTimer); countTimer = setInterval(() => { if (A.user && document.visibilityState === 'visible') refreshCounts(); }, 60000);
  route();
}
function setupScreen() {
  mount($('#root'), h('div', { class: 'card setup' }, h('h1', { class: 'serif', style: { 'margin-top': 0 }, text: 'Configuration requise' }),
    h('p', { text: 'Renseignez l’URL de votre projet Supabase et sa clé publique « anon » dans l’objet CONFIG en haut du script de admin.html (et de index.html).' }),
    h('div', { class: 'notice warn' }, icon('alert'), h('span', { text: 'N’utilisez JAMAIS la clé « service_role » dans ces fichiers : elle donnerait un accès total à votre base à n’importe quel visiteur.' })),
    h('p', { class: 'muted', text: 'Étapes détaillées : README.md, section « Installation ».' })));
}
(function boot() {
  if (!CONFIGURED || !sb) { setupScreen(); return; }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && A.user) { A.user = null; clearInterval(countTimer); loginScreen('Vous avez été déconnectée.'); } });
  start().catch(() => loginScreen('Impossible de joindre le serveur. Vérifiez votre connexion.'));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('admin-sw.js', { scope: './' }).catch(() => {});
})();
</script>
